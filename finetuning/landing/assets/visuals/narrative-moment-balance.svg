<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <rect width="400" height="220" fill="#0d0d10" rx="8"/>
  <text x="200" y="36" fill="#e8e8ec" font-size="18" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Восстановление баланса</text>
  <text x="200" y="62" fill="#8a8a9a" font-size="13" font-family="Inter, sans-serif" text-anchor="middle">Positives и borderlines возвращают recall, сохраняя hard negatives</text>
  <!-- balance scale metaphor -->
  <line x1="200" y1="170" x2="200" y2="90" stroke="#2DD4BF" stroke-width="3"/>
  <polygon points="200,85 190,100 210,100" fill="#2DD4BF"/>
  <line x1="80" y1="130" x2="320" y2="130" stroke="#2DD4BF" stroke-width="2"/>
  <circle cx="80" cy="130" r="6" fill="#FF6B6B"/>
  <text x="80" y="155" fill="#FF6B6B" font-size="12" font-family="Inter, sans-serif" text-anchor="middle">hard negatives</text>
  <circle cx="320" cy="130" r="6" fill="#96CEB4"/>
  <text x="320" y="155" fill="#96CEB4" font-size="12" font-family="Inter, sans-serif" text-anchor="middle">positives</text>
  <!-- center stable model -->
  <circle cx="200" cy="130" r="10" fill="#2DD4BF" opacity="0.6"/>
  <text x="200" y="200" fill="#2DD4BF" font-size="14" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 004: DA 80%, MAE 15.1</text>
</svg>
