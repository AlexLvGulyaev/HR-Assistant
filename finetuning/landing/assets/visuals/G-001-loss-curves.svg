<line x1="60" y1="335.5" x2="520" y2="335.5" stroke="#2a2a36" stroke-width="1"/>
<text x="50" y="340.5" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">0.25</text>
