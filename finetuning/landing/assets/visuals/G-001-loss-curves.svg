<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-label="Exp 001: eval loss drops, decision accuracy stays flat at 44%">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ffffff"/></marker></defs>
<rect width="1100" height="520" fill="#0d0d10" rx="8"/>
<text x="36" y="42" fill="#e8e8ec" font-size="24" font-family="Inter, sans-serif" text-anchor="start" font-weight="600">Exp 001: форма без смысла</text>
<text x="36" y="76" fill="#8a8a9a" font-size="15" font-family="Inter, sans-serif" text-anchor="start" font-weight="normal">Loss падает, decision accuracy остаётся на уровне базовой модели</text>

