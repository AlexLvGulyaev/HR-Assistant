<polyline points="60,261.6 175,350.9 290,357.5 405,362.1 520,365.4" fill="none" stroke="#4ECDC4" stroke-width="2.5" opacity="0.75"/>
<!-- eval loss: 0.344, 0.246, 0.235, 0.235, 0.239 -->
<polyline points="60,291.0 175,308.6 290,310.7 405,310.7 520,309.6" fill="none" stroke="#4ECDC4" stroke-width="3.5" stroke-dasharray="6,4" opacity="0.95"/>
<line x1="405" y1="124" x2="405" y2="406" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,4" opacity="0.8"/>
<text x="410" y="139" fill="#ffffff" font-size="12" font-family="Inter, sans-serif" text-anchor="start" font-weight="600">best ep4</text>

