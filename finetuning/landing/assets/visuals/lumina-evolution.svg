<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Эволюция Люмины: девять состояний от базовой модели до следующего цикла">
  <defs>
    <style>
      .label { font-family: Inter, sans-serif; font-size: 10px; fill: #8a8a9a; text-anchor: middle; }
      .state-label { font-family: Inter, sans-serif; font-size: 11px; font-weight: 600; fill: #e8e8ec; text-anchor: middle; }
    </style>
    <radialGradient id="glow-base" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.10"/><stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-form" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.18"/><stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-direction" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.24"/><stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-shell" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF6B6B" stop-opacity="0.22"/><stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-contracted" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFB347" stop-opacity="0.20"/><stop offset="100%" stop-color="#FFB347" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-balance" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.26"/><stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-learning" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.24"/><stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-production" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.30"/><stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-next" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.28"/><stop offset="100%" stop-color="#4ECDC4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="600" fill="#0a0a0c" rx="12"/>
  <text x="300" y="32" class="state-label" font-size="16" fill="#f0f0f5">Эволюция Люмины</text>
  <text x="300" y="50" class="label">Девять состояний от базовой модели до следующего цикла</text>

  <!-- Row 1 -->
  <g transform="translate(100,90)">
    <circle cx="0" cy="0" r="75" fill="url(#glow-base)"/>
    <circle cx="0" cy="0" r="45" fill="rgba(10,10,12,0.55)" stroke="#4ECDC4" stroke-width="1.5" opacity="0.95"/>
    <ellipse cx="-14" cy="-4" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-4" r="3" fill="#4ECDC4" opacity="0.8"/>
    <ellipse cx="14" cy="-4" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-4" r="3" fill="#4ECDC4" opacity="0.8"/>
    <path d="M-8 10 Q0 16 8 10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="70" class="state-label">base</text>
    <text x="0" y="84" class="label">Сцены 1–3</text>
  </g>

  <g transform="translate(300,90)">
    <circle cx="0" cy="0" r="78" fill="url(#glow-form)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#4ECDC4" stroke-width="1" opacity="0.45"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#4ECDC4" stroke-width="1.2" opacity="0.55"/>
    <circle cx="0" cy="0" r="45" fill="rgba(10,10,12,0.55)" stroke="#4ECDC4" stroke-width="1.5" opacity="0.95"/>
    <ellipse cx="-14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-3" r="3" fill="#4ECDC4" opacity="0.8"/>
    <ellipse cx="14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-3" r="3" fill="#4ECDC4" opacity="0.8"/>
    <line x1="-8" y1="11" x2="8" y2="11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="70" class="state-label">form</text>
    <text x="0" y="84" class="label">Сцены 4–5</text>
  </g>

  <g transform="translate(500,90)">
    <circle cx="0" cy="0" r="82" fill="url(#glow-direction)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#4ECDC4" stroke-width="1" opacity="0.35"/>
    <circle cx="0" cy="0" r="52" fill="rgba(10,10,12,0.55)" stroke="#4ECDC4" stroke-width="1.5" opacity="0.95"/>
    <line x1="0" y1="-52" x2="0" y2="-78" stroke="#4ECDC4" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/><circle cx="0" cy="-78" r="3" fill="#4ECDC4" opacity="0.9"/>
    <line x1="-45" y1="26" x2="-68" y2="39" stroke="#4ECDC4" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/><circle cx="-68" cy="39" r="3" fill="#4ECDC4" opacity="0.9"/>
    <line x1="45" y1="26" x2="68" y2="39" stroke="#4ECDC4" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/><circle cx="68" cy="39" r="3" fill="#4ECDC4" opacity="0.9"/>
    <ellipse cx="-14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-3" r="3" fill="#4ECDC4" opacity="0.8"/>
    <ellipse cx="14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-3" r="3" fill="#4ECDC4" opacity="0.8"/>
    <path d="M-10 10 Q0 16 10 10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="70" class="state-label">direction</text>
    <text x="0" y="84" class="label">Сцена 6</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(100,290)">
    <circle cx="0" cy="0" r="85" fill="url(#glow-shell)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FF6B6B" stroke-width="1.2" opacity="0.4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#FF6B6B" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="0" r="50" fill="rgba(10,10,12,0.55)" stroke="#FF6B6B" stroke-width="2" opacity="0.95"/>
    <ellipse cx="-14" cy="-1" rx="10" ry="6" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-1" r="3" fill="#FF6B6B" opacity="0.8"/>
    <ellipse cx="14" cy="-1" rx="10" ry="6" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-1" r="3" fill="#FF6B6B" opacity="0.8"/>
    <path d="M-9 -12 Q0 -18 9 -12" fill="none" stroke="#FF6B6B" stroke-width="1.5" opacity="0.6"/>
    <path d="M-10 14 L10 12" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="76" class="state-label">shell</text>
    <text x="0" y="90" class="label">Сцены 7–8a</text>
  </g>

  <g transform="translate(300,290)">
    <circle cx="0" cy="0" r="82" fill="url(#glow-contracted)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FFB347" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="52" fill="rgba(10,10,12,0.55)" stroke="#FFB347" stroke-width="1.8" opacity="0.95"/>
    <ellipse cx="-13" cy="-3" rx="9" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-13" cy="-3" r="3" fill="#FFB347" opacity="0.8"/>
    <ellipse cx="13" cy="-3" rx="9" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="13" cy="-3" r="3" fill="#FFB347" opacity="0.8"/>
    <path d="M-9 16 Q0 8 9 16" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <path d="M-10 -10 Q0 -14 10 -8" fill="none" stroke="#FFB347" stroke-width="1.5" opacity="0.6"/>
    <text x="0" y="70" class="state-label">contracted</text>
    <text x="0" y="84" class="label">Сцена 8b</text>
  </g>

  <g transform="translate(500,290)">
    <circle cx="0" cy="0" r="86" fill="url(#glow-balance)"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#2DD4BF" stroke-width="1.2" opacity="0.45"/>
    <circle cx="0" cy="0" r="56" fill="rgba(10,10,12,0.55)" stroke="#2DD4BF" stroke-width="1.6" opacity="0.95"/>
    <line x1="0" y1="-56" x2="0" y2="-80" stroke="#2DD4BF" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="0" cy="-80" r="3" fill="#2DD4BF" opacity="0.9"/>
    <line x1="-49" y1="28" x2="-69" y2="40" stroke="#2DD4BF" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="-69" cy="40" r="3" fill="#2DD4BF" opacity="0.9"/>
    <line x1="49" y1="28" x2="69" y2="40" stroke="#2DD4BF" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="69" cy="40" r="3" fill="#2DD4BF" opacity="0.9"/>
    <ellipse cx="-14" cy="-4" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-4" r="3" fill="#2DD4BF" opacity="0.8"/>
    <ellipse cx="14" cy="-4" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-4" r="3" fill="#2DD4BF" opacity="0.8"/>
    <path d="M-10 11 Q0 17 10 11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="72" class="state-label">balance</text>
    <text x="0" y="86" class="label">Сцены 9–11</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(100,490)">
    <circle cx="0" cy="0" r="88" fill="url(#glow-learning)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="58" fill="rgba(10,10,12,0.55)" stroke="#2DD4BF" stroke-width="1.6" opacity="0.95"/>
    <line x1="0" y1="-58" x2="0" y2="-84" stroke="#2DD4BF" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="0" cy="-84" r="3" fill="#2DD4BF" opacity="0.9"/>
    <line x1="-50" y1="29" x2="-72" y2="42" stroke="#2DD4BF" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="-72" cy="42" r="3" fill="#2DD4BF" opacity="0.9"/>
    <line x1="50" y1="29" x2="72" y2="42" stroke="#2DD4BF" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="72" cy="42" r="3" fill="#2DD4BF" opacity="0.9"/>
    <ellipse cx="-14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-3" r="3" fill="#2DD4BF" opacity="0.8"/>
    <ellipse cx="14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-3" r="3" fill="#2DD4BF" opacity="0.8"/>
    <line x1="-8" y1="11" x2="8" y2="11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="72" class="state-label">learning</text>
    <text x="0" y="86" class="label">Сцены 12–13b</text>
  </g>

  <g transform="translate(300,490)">
    <circle cx="0" cy="0" r="92" fill="url(#glow-production)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#4ECDC4" stroke-width="1" opacity="0.45"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#4ECDC4" stroke-width="0.8" opacity="0.35"/>
    <circle cx="0" cy="0" r="56" fill="rgba(10,10,12,0.55)" stroke="#4ECDC4" stroke-width="1.8" opacity="0.95"/>
    <line x1="0" y1="-56" x2="0" y2="-88" stroke="#4ECDC4" stroke-width="1.8" opacity="0.7" stroke-linecap="round"/><circle cx="0" cy="-88" r="4" fill="#4ECDC4" opacity="0.9"/>
    <line x1="-35" y1="-44" x2="-54" y2="-68" stroke="#4ECDC4" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="-54" cy="-68" r="3" fill="#4ECDC4" opacity="0.9"/>
    <line x1="35" y1="-44" x2="54" y2="-68" stroke="#4ECDC4" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="54" cy="-68" r="3" fill="#4ECDC4" opacity="0.9"/>
    <line x1="-53" y1="31" x2="-78" y2="46" stroke="#4ECDC4" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="-78" cy="46" r="3" fill="#4ECDC4" opacity="0.9"/>
    <line x1="53" y1="31" x2="78" y2="46" stroke="#4ECDC4" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/><circle cx="78" cy="46" r="3" fill="#4ECDC4" opacity="0.9"/>
    <ellipse cx="-14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-3" r="3" fill="#4ECDC4" opacity="0.8"/>
    <ellipse cx="14" cy="-3" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-3" r="3" fill="#4ECDC4" opacity="0.8"/>
    <path d="M-10 11 Q0 17 10 11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="72" class="state-label">production</text>
    <text x="0" y="86" class="label">Сцены 14–18</text>
  </g>

  <g transform="translate(500,490)">
    <circle cx="0" cy="0" r="90" fill="url(#glow-next)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#4ECDC4" stroke-width="1" opacity="0.35"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#4ECDC4" stroke-width="0.8" opacity="0.28"/>
    <circle cx="0" cy="0" r="54" fill="rgba(10,10,12,0.55)" stroke="#4ECDC4" stroke-width="1.6" opacity="0.95"/>
    <line x1="0" y1="-54" x2="0" y2="-82" stroke="#4ECDC4" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/><circle cx="0" cy="-82" r="3" fill="#4ECDC4" opacity="0.7"/>
    <line x1="-50" y1="31" x2="-70" y2="43" stroke="#4ECDC4" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/><circle cx="-70" cy="43" r="3" fill="#4ECDC4" opacity="0.7"/>
    <line x1="50" y1="31" x2="70" y2="43" stroke="#4ECDC4" stroke-width="1.6" opacity="0.6" stroke-linecap="round"/><circle cx="70" cy="43" r="3" fill="#4ECDC4" opacity="0.7"/>
    <ellipse cx="-14" cy="-4" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="-14" cy="-4" r="3" fill="#4ECDC4" opacity="0.8"/>
    <ellipse cx="14" cy="-4" rx="10" ry="7" fill="#ffffff" opacity="0.9"/><circle cx="14" cy="-4" r="3" fill="#4ECDC4" opacity="0.8"/>
    <path d="M-10 10 Q0 16 10 10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
    <text x="0" y="72" class="state-label">next</text>
    <text x="0" y="86" class="label">Сцены 19–21</text>
  </g>

  <!-- connecting arrows between states -->
  <g opacity="0.2" stroke="#4ECDC4" stroke-width="1" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#4ECDC4"/></marker></defs>
    <path d="M160 90 L240 90"/>
    <path d="M360 90 L440 90"/>
    <path d="M500 160 L500 240"/>
    <path d="M440 290 L360 290"/>
    <path d="M240 290 L160 290"/>
    <path d="M100 360 L100 440"/>
    <path d="M160 490 L240 490"/>
    <path d="M360 490 L440 490"/>
  </g>
</svg>