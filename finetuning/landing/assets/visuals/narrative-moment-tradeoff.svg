<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <rect width="400" height="220" fill="#0d0d10" rx="8"/>
  <text x="200" y="36" fill="#e8e8ec" font-size="18" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Переломный момент: торговля</text>
  <text x="200" y="62" fill="#8a8a9a" font-size="13" font-family="Inter, sans-serif" text-anchor="middle">Hard negatives убили false positives — но снизили recall</text>
  <!-- precision / recall scales -->
  <line x1="60" y1="170" x2="340" y2="170" stroke="#2a2a36" stroke-width="1"/>
  <line x1="60" y1="170" x2="60" y2="100" stroke="#2a2a36" stroke-width="1"/>
  <text x="60" y="190" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="middle">Exp 002</text>
  <text x="340" y="190" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="middle">Exp 003</text>
  <!-- precision arrow up -->
  <path d="M80 150 L200 110 L320 90" fill="none" stroke="#96CEB4" stroke-width="3" stroke-linecap="round" marker-end="url(#arrup)"/>
  <text x="200" y="95" fill="#96CEB4" font-size="13" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Precision ↑</text>
  <!-- recall arrow down -->
  <path d="M80 120 L200 140 L320 155" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrdown)"/>
  <text x="200" y="168" fill="#FF6B6B" font-size="13" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Recall ↓</text>
  <defs>
    <marker id="arrup" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#96CEB4"/>
    </marker>
    <marker id="arrdown" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF6B6B"/>
    </marker>
  </defs>
</svg>
