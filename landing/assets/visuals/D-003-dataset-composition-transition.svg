<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Dataset composition transition">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#0d0d10" rx="8"/>
  <text x="30" y="30" fill="#e8e8ec" font-size="16" font-family="Inter, sans-serif" text-anchor="start" font-weight="600">Dataset composition transition</text>
  <text x="30" y="50" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="start" font-weight="normal">Two levers: hard negatives cut false positives; positives restore recall</text>
  <rect x="60" y="110" width="180" height="140" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="6"/>
  <text x="150.0" y="150" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Exp 001/002</text>
  <text x="150.0" y="195" fill="#4ECDC4" font-size="28" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">90</text>
  <text x="150.0" y="228" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">baseline</text>
  <path d="M 245 180.0 L 265 180.0" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="270" y="110" width="180" height="140" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="6"/>
  <text x="360.0" y="150" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Exp 003</text>
  <text x="360.0" y="195" fill="#FF6B6B" font-size="28" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">123</text>
  <text x="360.0" y="228" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">+33 hard negatives</text>
  <path d="M 455 180.0 L 475 180.0" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="480" y="110" width="180" height="140" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="6"/>
  <text x="570.0" y="150" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Exp 004</text>
  <text x="570.0" y="195" fill="#96CEB4" font-size="28" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">162</text>
  <text x="570.0" y="228" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">+39 positives / borderlines</text>
</svg>
