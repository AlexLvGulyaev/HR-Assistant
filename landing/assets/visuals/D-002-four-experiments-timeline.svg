<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Four experiments timeline">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ffffff"/></marker></defs>
<rect width="900" height="280" fill="#0d0d10" rx="8"/>
<text x="30" y="30" fill="#e8e8ec" font-size="16" font-family="Inter, sans-serif" text-anchor="start" font-weight="600">Four experiments answered each other's questions</text>
<text x="30" y="50" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="start" font-weight="normal">Each dot is a hypothesis and its unexpected outcome</text>
<line x1="90" y1="140" x2="750" y2="140" stroke="#8a8a9a" stroke-width="2"/>
<circle cx="90" cy="140" r="10" fill="#4ECDC4" stroke="#ffffff" stroke-width="1"/>
<text x="90" y="168" fill="#4ECDC4" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 001</text>
<text x="90" y="188" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Baseline LoRA</text>
<text x="90" y="230" fill="#e8e8ec" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">→ Form without meaning</text>
<circle cx="310" cy="140" r="10" fill="#FFB347" stroke="#ffffff" stroke-width="1"/>
<text x="310" y="168" fill="#FFB347" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 002</text>
<text x="310" y="188" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Tune dynamics</text>
<text x="310" y="230" fill="#e8e8ec" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">→ Better, but misses traps</text>
<circle cx="530" cy="140" r="10" fill="#FF6B6B" stroke="#ffffff" stroke-width="1"/>
<text x="530" y="168" fill="#FF6B6B" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 003</text>
<text x="530" y="188" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Hard negatives</text>
<text x="530" y="230" fill="#e8e8ec" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">→ No FP in smoke</text>
<circle cx="750" cy="140" r="10" fill="#96CEB4" stroke="#ffffff" stroke-width="1"/>
<text x="750" y="168" fill="#96CEB4" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 004</text>
<text x="750" y="188" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Positives</text>
<text x="750" y="230" fill="#e8e8ec" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">→ Balance restored</text>
</svg>
