<text x="360.0" y="144.0" fill="#FF6B6B" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 003
hard negatives</text>
<rect x="60" y="190" width="200" height="100" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="4"/>
<text x="160.0" y="244.0" fill="#8a8a9a" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">—</text>
<rect x="260" y="190" width="200" height="100" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="4"/>
<text x="360.0" y="244.0" fill="#96CEB4" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 004
balance</text>
<text x="50" y="140.0" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">Recall</text>
<text x="50" y="240.0" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal"></text>
<text x="160.0" y="75" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">Precision</text>
